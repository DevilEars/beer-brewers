<title id="t">Comfortable plan wiring overview</title>
<desc id="d">Logical wiring for the comfortable plan: socket, plug, in-line RCD, IP65 enclosure with fuse, 5 V PSU, ESP32 running Brautomat32, 40 A SSR and pump relay, protective earth to every metal part.</desc>
