<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From-scratch control PCB block diagram</title>
<desc id="d">Block diagram of the custom ESP32 control PCB: fused and MOV-protected mains input to a 5 V encapsulated PSU, isolation slot, D1 Mini ESP32 running Brautomat32, transistor drivers for the SSR, pump relay and buzzer, DS18B20 and MAX31865 inputs.</desc>
