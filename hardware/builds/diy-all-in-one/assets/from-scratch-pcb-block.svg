<text x="685.0" y="283" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">on 2.54 mm sockets</text>
<text x="685.0" y="298" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">3.3 V from module LDO</text>
<text x="685.0" y="313" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">USB: flash with mains off</text>
<text x="520" y="460" font-size="11.5" font-weight="800" text-anchor="start" fill="#6B46C1">D5</text>
<text x="640" y="460" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">→ Q1 SSR (PIN white [Relay])</text>
<text x="520" y="482" font-size="11.5" font-weight="800" text-anchor="start" fill="#6B46C1">D0</text>
<text x="640" y="482" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">→ Q2 pump relay actuator</text>
<text x="520" y="504" font-size="11.5" font-weight="800" text-anchor="start" fill="#6B46C1">D8</text>
<text x="640" y="504" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">→ Q3 buzzer (Brautomat fixed)</text>
