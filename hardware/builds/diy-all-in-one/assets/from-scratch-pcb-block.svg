<text x="24" y="30" font-size="20" font-weight="800" text-anchor="start" fill="#FFFFFF">From-scratch plan · control PCB block diagram (rev 0, unvalidated)</text>
<text x="24" y="52" font-size="12" font-weight="400" text-anchor="start" fill="#CBD2D9">2-layer 100 × 80 mm · Brautomat32-compatible pin use on a D1 Mini ESP32 · mains zone and LV zone split by a routed slot</text>
