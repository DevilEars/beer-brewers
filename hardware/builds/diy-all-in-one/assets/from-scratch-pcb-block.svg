<text x="66" y="604" font-size="12" font-weight="800" text-anchor="start" fill="#C53030">Element current does NOT cross this PCB.</text>
<text x="66" y="624" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">L → MCB → SSR (on heatsink) → element, wired with</text>
<text x="66" y="641" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">electrician-sized flex on DIN terminals. PE goes to the</text>
<text x="66" y="658" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">PE bar, never to a PCB trace. Pump draw &lt; 1 A.</text>
<path d="M430,285 L560,285" fill="none" stroke="#6B46C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrL)"/>
<text x="495" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#6B46C1">+5 V</text>
