<text x="640" y="526" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">← DS18B20 + 4.7 kΩ (fixed)</text>
<text x="520" y="548" font-size="11.5" font-weight="800" text-anchor="start" fill="#6B46C1">D9 D10 D11 D13</text>
<text x="640" y="548" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">→ MAX31865 SPI + CS0</text>
<text x="520" y="570" font-size="11.5" font-weight="800" text-anchor="start" fill="#6B46C1">D1 D2 D6 D7</text>
<text x="640" y="570" font-size="11" font-weight="400" text-anchor="start" fill="#1F2933">reserved: display, GGM IDS</text>
