<path d="M240,380 L310,440 L310,576" fill="none" stroke="#C53030" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440.0,392 L450,440 L450,576" fill="none" stroke="#C53030" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M680,576 L680,440 L580.0,400" fill="none" stroke="#6B46C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M530.0,350 L355,350 L315,310" fill="none" stroke="#6B46C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrL)"/>
<rect x="880" y="110" width="310" height="480" rx="10" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="1.5"/>
<text x="896" y="136" font-size="14" font-weight="800" text-anchor="start" fill="#1F2933">Layout rules (to review)</text>
<text x="896" y="162" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">Glands on the bottom face only;</text>
<text x="896" y="181" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">nothing enters from the top.</text>
<text x="896" y="200" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">Mains left, LV right. The only LV</text>
<text x="896" y="219" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">run into the 230 V zone is the</text>
<text x="896" y="238" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">sleeved SSR control pair.</text>
<text x="896" y="257" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">PE: every metal part, the element</text>
<text x="896" y="276" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">earth and pump earth land on the</text>
<text x="896" y="295" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">PE bar with ring lugs; star layout.</text>
<text x="896" y="314" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">SSR heat: ≈12 W at 10 A. Heatsink</text>
<text x="896" y="333" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">outside the box, SSR inside, through</text>
<text x="896" y="352" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">a gasketed cut-out; IP rating of the</text>
<text x="896" y="371" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">cut-out must be checked.</text>
<text x="896" y="390" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">Ferrules on all stranded ends.</text>
<text x="896" y="409" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">Cable sizes, MCB curve and RCD</text>
<text x="896" y="428" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">coordination: electrician decides.</text>
<text x="896" y="447" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">Lid label: '230 V – isolate before</text>
<text x="896" y="466" font-size="11.5" font-weight="400" text-anchor="start" fill="#1F2933">opening' + build date + rev.</text>
<text x="1204" y="708" font-size="10" text-anchor="end" fill="#52606D">DevilEars/beer-brewers · DIY all-in-one · design drawing, not a construction certificate · MIT</text>
</svg>
