<text x="400.0" y="318" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">J1 L/N in</text>
<text x="400.0" y="333" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">F1 T1A · RV1</text>
<text x="400.0" y="348" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">U1 LH05 5 V</text>
<text x="400.0" y="363" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">K1 pump relay</text>
<text x="400.0" y="378" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">F2 T1A · J2 out</text>
<rect x="510.0" y="296" width="8" height="98" rx="0" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.5"/>
<text x="514.0" y="408" font-size="9" font-weight="400" text-anchor="middle" fill="#1F2933">slot</text>
<rect x="530.0" y="296" width="130" height="70" rx="4" fill="#EAE2FB" stroke="#6B46C1" stroke-width="1.5"/>
<text x="595.0" y="326" font-size="11" font-weight="700" text-anchor="middle" fill="#6B46C1">ESP32 D1 Mini</text>
<text x="595.0" y="342" font-size="9" font-weight="400" text-anchor="middle" fill="#52606D">on sockets · USB faces up</text>
<text x="530.0" y="382" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">J3 SSR ctl · J4 DS18B20</text>
<text x="530.0" y="396" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">J5 MAX31865 · BZ1 · LED</text>
