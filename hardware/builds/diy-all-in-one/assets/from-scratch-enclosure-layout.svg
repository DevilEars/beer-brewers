<circle cx="450" cy="590" r="14" fill="#D9DEE3" stroke="#1F2933" stroke-width="2"/>
<circle cx="450" cy="590" r="6" fill="#1F2933" stroke="none" stroke-width="1.5"/>
<text x="450" y="624" font-size="11" font-weight="700" text-anchor="middle" fill="#1F2933">G3 pump out</text>
