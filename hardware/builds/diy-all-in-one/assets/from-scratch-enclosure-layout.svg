<title id="t">From-scratch enclosure layout</title>
<desc id="d">Top view of the IP65 240 by 160 by 90 millimetre enclosure: 16 A two-pole MCB and PE bar on DIN rail, control PCB, SSR mounted on an external heatsink, four M20 glands, mains and low-voltage segregation.</desc>
