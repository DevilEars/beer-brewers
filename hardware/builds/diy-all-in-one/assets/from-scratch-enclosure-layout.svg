<text x="204.0" y="212" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">electrician</text>
<rect x="274" y="174" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="1.5"/>
<text x="349.0" y="199.0" font-size="12" font-weight="700" text-anchor="middle" fill="#2F855A">PE bar</text>
<rect x="150" y="270" width="165" height="110" rx="8" fill="#FFFFFF" stroke="#C53030" stroke-width="1.5"/>
<text x="232.5" y="290" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2933">SSR 40 A</text>
<text x="232.5" y="308" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">KSI240D40-L</text>
<text x="232.5" y="323" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">bolted through wall to</text>
<text x="232.5" y="338" font-size="11" font-weight="400" text-anchor="middle" fill="#52606D">external heatsink KHS-1B</text>
<rect x="70" y="260" width="50" height="130" rx="0" fill="url(#hatch)" stroke="#52606D" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="64" y="300" font-size="10" font-weight="400" text-anchor="end" fill="#52606D">heatsink</text>
<text x="64" y="313" font-size="10" font-weight="400" text-anchor="end" fill="#52606D">outside,</text>
<text x="64" y="326" font-size="10" font-weight="400" text-anchor="end" fill="#52606D">gasketed</text>
<text x="64" y="339" font-size="10" font-weight="400" text-anchor="end" fill="#52606D">cut-out</text>
<rect x="380.0" y="260" width="300" height="240" rx="6" fill="#DDF3E4" fill-opacity="0.85" stroke="#2F855A" stroke-width="1.5"/>
<text x="390.0" y="282" font-size="11" font-weight="700" text-anchor="start" fill="#2F855A">Control PCB 100 × 80 (spans both zones; slot at the boundary)</text>
