name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned to v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      # Use the official gitleaks CLI rather than gitleaks-action.
      # (gitleaks-action requires a license on organization repos; this is a
      # personal repo, but the CLI avoids that constraint entirely.)
      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${asset}"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${asset}" "${url}"
          echo "${expected}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks git --verbose --redact --no-banner --log-opts="--all --full-history"
